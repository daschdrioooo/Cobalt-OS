<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>

<body>
    <div class="window" id="notes" style="display: none;">
        <div class="windowheader" id="notesheader">
            <p class="windowheaderText">
                Notes
            </p>
            <p class="closeButton" id="notesclose">
                [ x ]
            </p>
        </div>
        
        <div style="background-color: white; margin: 6px; width: 520px; height: 400px; padding: 16px; display: flex;">
            <div style="display: flex; flex-direction: column; width: 160px; margin-right: 16px;">
                <button id="newNoteButton" style="cursor: pointer;">New Note</button>
                <div id="notesSidebar" style="overflow-y: scroll; background-color: #eeeeee; padding: 16px; border-radius: 4px; font-family: courier; flex: 1;"></div>
            </div>
            <div id="notesContent" style="overflow-y: scroll; flex: 1;"></div>
        </div>
    </div>
</body>
</html>
